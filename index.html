<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153d63"><link rel="manifest" href="manifest.webmanifest"><title>국소배기장치 필요환기량 계산기</title><style>:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#15293c;background:#f1f5f9}*{box-sizing:border-box}body{margin:0}main{max-width:660px;margin:auto;padding:18px}h1{font-size:23px;margin:0 0 8px}p{line-height:1.5}.muted{color:#52677c;font-size:13px}.panel{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #122b4212}.field{margin:12px 0}label{display:block;font-weight:650;font-size:14px;margin-bottom:7px}input,select{width:100%;padding:12px;border:1px solid #c4d0dd;border-radius:9px;font:inherit;background:white}input:focus,select:focus{outline:2px solid #287bc2}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.result{background:#123f65;color:white;padding:22px;border-radius:12px;text-align:center}.result strong{font-size:30px;display:block;margin:8px 0}.warn{color:#9b3d12;background:#fff3e5;padding:10px;border-radius:8px;margin:12px 0}.formula{font-weight:700;text-align:center;background:#eef4fa;border-radius:9px;padding:14px}button{border:0;background:#1769a6;color:white;padding:12px 18px;border-radius:9px;font-weight:700;cursor:pointer}small{color:#52677c}footer{font-size:12px;color:#52677c;margin:20px 0} @media(max-width:380px){.grid{grid-template-columns:1fr}}</style></head><body><main><header><h1>국소배기장치 필요환기량 계산기</h1><div class="muted">후드 형상별 설계 환기량 산정 · v1.6</div></header><section class="panel"><div class="field"><label for="cat">1. 후드 종류</label><select id="cat"><option value="booth">부스식</option><option value="external" selected>외부식</option><option value="canopy">캐노피식</option></select></div><div class="field" id="hoodRow"><label for="hood">2. 후드 세부 형식</label><select id="hood"><option value="plain">일반형</option><option value="flanged">플랜지 일반형</option><option value="slot">슬롯형</option><option value="fslot">플랜지 슬롯형</option><option value="multi">다중 슬롯형</option><option value="fmulti">플랜지 다중 슬롯형</option></select></div><div class="field" id="shapeRow"><label for="shape" id="shapeLabel">3. 후드 개구부 형태</label><select id="shape"><option value="rect">사각형</option><option value="round">원형</option></select></div><div id="inputs"></div><div id="warn" class="warn" hidden></div></section><section class="panel"><div class="muted">적용 계산식</div><div class="formula" id="formula"></div><p class="muted" id="details"></p><div class="field"><label for="unit">환기량 표시 단위</label><select id="unit"><option value="60">m³/min</option><option value="3600">m³/h</option><option value="1">m³/s</option></select></div><div class="result"><span>필요환기량</span><strong id="result">—</strong><span id="unitText">m³/min</span></div><p id="converted"></p><button id="copy" type="button">계산 결과 복사</button></section><footer>참고용 경험식 계산기입니다. 실제 설계에는 후드 형상, 작업 조건, 적용식의 유효범위 및 시스템 압력손실 검토가 필요합니다. 다중 슬롯형의 면적 정의는 설계자료와 대조해야 합니다. 원형/사각형 및 캐노피식의 세부 적용성도 확인하십시오.</footer></main><script>
const $=id=>document.getElementById(id); const labels={v:'제어속도 V (m/s)',w:'후드 개구부 가로 W (m)',h:'후드 개구부 높이 H (m)',l:'슬롯 길이 L (m)',sw:'슬롯 폭 W (m)',diam:'후드 지름 D (m)',x:'오염원과 후드 사이 거리 X (m)',dist:'작업면과 후드 사이 높이 D (m)'};const values={v:'0.5',w:'1.0',h:'0.8',l:'1.0',sw:'0.1',diam:'0.5',x:'0.3',dist:'0.5'};let last=null;const fmt=n=>n.toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});const n=k=>Number(values[k]);
function draw(){const cat=$('cat').value,hood=$('hood').value,slot=cat==='external'&&['slot','fslot'].includes(hood),multi=cat==='external'&&['multi','fmulti'].includes(hood),special=slot||multi,round=$('shape').value==='round';$('hoodRow').hidden=cat!=='external';$('shapeRow').hidden=special;$('shapeLabel').textContent=(cat==='external'?'3':'2')+'. 후드 개구부 형태';const keys=cat==='booth'?['v',...(round?['diam']:['w','h'])]:cat==='canopy'?['v','dist',...(round?['diam']:['w','h'])]:special?['v','x','l','sw']:['v','x',...(round?['diam']:['w','h'])];$('inputs').innerHTML=(multi?'<p class="muted">다중 슬롯형: L과 W는 개별 슬롯이 아닌 전체 후드 전면의 길이와 폭입니다. A = L × W로 계산합니다.</p>':'')+'<h3>'+(cat==='external'?(special?'3':'4'):'3')+'. 설계조건 입력</h3><div class="grid">'+keys.map(k=>'<div class="field"><label for="in_'+k+'">'+labels[k]+'</label><input id="in_'+k+'" type="number" step="any" min="0" inputmode="decimal" value="'+values[k]+'"></div>').join('')+'</div>';keys.forEach(k=>$('in_'+k).addEventListener('input',e=>{values[k]=e.target.value;calc()}));calc()}
function calc(){const cat=$('cat').value,hood=$('hood').value,slot=cat==='external'&&['slot','fslot'].includes(hood),multi=cat==='external'&&['multi','fmulti'].includes(hood),special=slot||multi,round=$('shape').value==='round';const keys=cat==='booth'?['v',...(round?['diam']:['w','h'])]:cat==='canopy'?['v','dist',...(round?['diam']:['w','h'])]:special?['v','x','l','sw']:['v','x',...(round?['diam']:['w','h'])];const valid=keys.every(k=>values[k].trim()!==''&&Number.isFinite(n(k))&&n(k)>0);const area=multi?n('l')*n('sw'):(round?Math.PI*n('diam')**2/4:n('w')*n('h'));const perimeter=round?Math.PI*n('diam'):2*(n('w')+n('h'));const ratio=special?n('sw')/n('l'):Math.min(n('w'),n('h'))/Math.max(n('w'),n('h'));const wrong=valid&&cat==='external'&&(slot?ratio>0.2:multi?ratio<0.2:!round&&ratio<0.2);let formula,q;if(cat==='booth'){formula='Q = V × A';q=n('v')*area}else if(cat==='canopy'){formula='Q = 1.4PVD';q=1.4*perimeter*n('v')*n('dist')}else if(slot){formula=hood==='slot'?'Q = 3.7LVX':'Q = 2.6LVX';q=(hood==='slot'?3.7:2.6)*n('l')*n('v')*n('x')}else{const coeff=['flanged','fmulti'].includes(hood)?0.75:1;formula=coeff===0.75?'Q = 0.75V(10X² + A)':'Q = V(10X² + A)';q=coeff*n('v')*(10*n('x')**2+area)}$('formula').textContent=formula;$('details').textContent=valid?(special?(multi?'전체 후드 전면적 A: ':'슬롯 개구면적: ')+fmt(n('l')*n('sw'))+' m² · 형상비 W/L: '+ratio.toFixed(3):'개구면적 A: '+fmt(area)+' m²'+(cat==='canopy'?' · 둘레길이 P: '+fmt(perimeter)+' m':'')):'0보다 큰 수치를 입력하세요.';$('warn').hidden=!wrong;$('warn').textContent=wrong?'선택한 공식의 형상비 적용 범위를 벗어났습니다. 결과는 참고용이며 설계값으로 확정하지 마세요.':'';const unit=Number($('unit').value);$('unitText').textContent=$('unit').selectedOptions[0].textContent;$('result').textContent=valid?fmt(q*unit):'—';$('converted').textContent=valid?'분당 '+fmt(q*60)+' m³/min · 시간당 '+fmt(q*3600)+' m³/h':'';last=valid?{cat,hood,slot,round,keys,formula,q,wrong}:null}
['cat','hood','shape'].forEach(id=>$(id).addEventListener('change',draw));$('unit').addEventListener('change',calc);$('copy').addEventListener('click',async()=>{if(!last)return;const s='국소배기장치 필요환기량 계산\n후드: '+last.cat+' / '+last.hood+'\n'+last.keys.map(k=>labels[k]+': '+values[k]).join('\n')+'\n'+last.formula+'\nQ = '+fmt(last.q*60)+' m³/min\nQ = '+fmt(last.q*3600)+' m³/h'+(last.wrong?'\n주의: 형상비 적용범위 초과':'');try{await navigator.clipboard.writeText(s);alert('복사했습니다.')}catch(e){prompt('아래 내용을 복사하세요.',s)}});draw();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
